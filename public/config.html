<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面配置</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <script src="/js/echarts.min.js"></script>
    <script src="/js/china.js"></script>
    <style>
        .draggable-item {
            cursor: move;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            border-radius: 5px;
            background-color: #f8f9fa;
            user-select: none;
        }
        
        .draggable-item:hover {
            background-color: #e9ecef;
        }
        
        .drag-handle {
            cursor: move;
            padding: 10px;
            background-color: #0d6efd;
            color: white;
            border-radius: 5px 5px 0 0;
        }
        
        .component-form {
            padding: 15px;
        }
        
        .component-controls {
            padding: 10px;
            border-top: 1px solid #ddd;
            background-color: #f8f9fa;
        }
        
        .drag-over {
            border: 2px dashed #0d6efd;
            background-color: #e7f1ff;
        }
        
        .dragging {
            opacity: 0.5;
        }
        
        .drag-target-top::before {
            content: "";
            position: absolute;
            top: -5px;
            left: 0;
            right: 0;
            height: 4px;
            background-color: #0d6efd;
            border-radius: 2px;
        }
        
        /* 地图相关样式 */
        .map-container {
            position: relative;
            width: 100%;
            height: 500px;
            margin: 20px 0;
            border: 1px solid #ddd;
            background-color: #f8f9fa;
        }
        
        .province {
            fill: #ccc;
            stroke: #fff;
            stroke-width: 1;
            cursor: pointer;
            transition: fill 0.3s;
        }
        
        .province:hover {
            fill: #aaa;
        }
        
        .province.selected {
            fill: #0d6efd;
        }
        
        .province-configured {
            fill: #0d6efd;
        }
        
        .province-configured.selected {
            fill: #0d6efd;
        }
        
        .province-label {
            font-size: 10px;
            pointer-events: none;
            user-select: none;
        }
        
        .control-panel {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .monitor-select {
            max-width: 300px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>页面配置</span>
                        <div>
                            <button class="btn btn-success me-2" id="addComponent">添加组件</button>
                            <button class="btn btn-primary me-2" id="saveConfig">保存配置</button>
                            <button class="btn btn-secondary" id="backButton">返回</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <form id="pageConfigForm">
                            <input type="hidden" id="pageId">
                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="pageEnabled" checked>
                                <label class="form-check-label" for="pageEnabled">启用</label>
                            </div>
                            
                            <div class="mb-3">
                                <label for="pageTitle" class="form-label">页面标题</label>
                                <input type="text" class="form-control" id="pageTitle" placeholder="请输入页面显示标题">
                            </div>
                            <div class="mb-3">
                                <label for="pageRoute" class="form-label">路由</label>
                                <input type="text" class="form-control" id="pageRoute" placeholder="输入 data 以在 /board/data 访问">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">组件列表</label>
                                <div id="componentsContainer" class="mt-2 position-relative">
                                    <!-- 组件将通过JavaScript动态添加 -->
                                    <div class="text-center text-muted" id="noComponentsMessage">
                                        暂无组件，请点击"添加组件"按钮添加组件
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加组件模态框 -->
    <div class="modal fade" id="addComponentModal" tabindex="-1" aria-labelledby="addComponentModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addComponentModalLabel">添加组件</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-primary btn-lg" data-component-type="tcp">TCP监控</button>
                        <button type="button" class="btn btn-success btn-lg" data-component-type="udp">UDP监控</button>
                        <button type="button" class="btn btn-info btn-lg" data-component-type="http">HTTP(S)监控</button>
                        <button type="button" class="btn btn-warning btn-lg" data-component-type="map">地图组件</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- TCP组件配置模态框 -->
    <div class="modal fade" id="tcpComponentModal" tabindex="-1" aria-labelledby="tcpComponentModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="tcpComponentModalLabel">配置TCP监控组件</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="tcpComponentForm">
                        <input type="hidden" id="tcpComponentId">
                        <div class="mb-3">
                            <label for="tcpTitle" class="form-label">组件标题</label>
                            <input type="text" class="form-control" id="tcpTitle" placeholder="请输入组件显示标题">
                        </div>
                        <div class="mb-3">
                            <label for="tcpMonitorSelect" class="form-label">选择TCP监控项</label>
                            <select class="form-select" id="tcpMonitorSelect" required>
                                <option value="">请选择TCP监控项</option>
                                <!-- 选项将通过JavaScript动态添加 -->
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveTcpComponent">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- UDP组件选择模态框 -->
    <div class="modal fade" id="udpComponentModal" tabindex="-1" aria-labelledby="udpComponentModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="udpComponentModalLabel">选择UDP监控</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="udpComponentForm">
                        <input type="hidden" id="udpComponentId">
                        <div class="mb-3">
                            <label for="udpTitle" class="form-label">组件标题</label>
                            <input type="text" class="form-control" id="udpTitle" placeholder="请输入组件显示标题">
                        </div>
                        <div class="mb-3">
                            <label for="udpMonitorSelect" class="form-label">选择UDP监控项</label>
                            <select class="form-select" id="udpMonitorSelect" required>
                                <option value="">请选择UDP监控项</option>
                                <!-- 选项将通过JavaScript动态添加 -->
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveUdpComponent">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- HTTP组件选择模态框 -->
    <div class="modal fade" id="httpComponentModal" tabindex="-1" aria-labelledby="httpComponentModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="httpComponentModalLabel">选择HTTP(S)监控</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="httpComponentForm">
                        <input type="hidden" id="httpComponentId">
                        <div class="mb-3">
                            <label for="httpTitle" class="form-label">组件标题</label>
                            <input type="text" class="form-control" id="httpTitle" placeholder="请输入组件显示标题">
                        </div>
                        <div class="mb-3">
                            <label for="httpMonitorSelect" class="form-label">选择HTTP(S)监控项</label>
                            <select class="form-select" id="httpMonitorSelect" required>
                                <option value="">请选择HTTP(S)监控项</option>
                                <!-- 选项将通过JavaScript动态添加 -->
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveHttpComponent">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 地图组件模态框 -->
    <div class="modal fade" id="mapComponentModal" tabindex="-1" aria-labelledby="mapComponentModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="mapComponentModalLabel">添加地图组件</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="mapComponentForm">
                        <input type="hidden" id="mapComponentId">
                        <div class="mb-3">
                            <label for="mapComponentName" class="form-label">地图组件名称</label>
                            <input type="text" class="form-control" id="mapComponentName" placeholder="请输入地图组件名称">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveMapComponent">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 地图组件配置模态框 -->
    <div class="modal fade" id="mapConfigModal" tabindex="-1" aria-labelledby="mapConfigModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="mapConfigModalLabel">地图组件配置</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="mapConfigForm">
                        <input type="hidden" id="mapConfigComponentId">
                        
                        <div class="mb-3">
                            <label for="mapConfigComponentName" class="form-label">地图组件名称</label>
                            <input type="text" class="form-control" id="mapConfigComponentName" placeholder="请输入地图组件名称">
                        </div>
                        
                        <div class="control-panel mb-3">
                            <div class="row align-items-center">
                                <div class="col-md-4">
                                    <h5>当前选中省份: <span id="selectedProvince">无</span></h5>
                                </div>
                                <div class="col-md-4">
                                    <select class="form-select monitor-select" id="monitorType">
                                        <option value="">选择监控类型</option>
                                        <option value="tcp">TCP监控</option>
                                        <option value="udp">UDP监控</option>
                                        <option value="http">HTTP(S)监控</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <select class="form-select monitor-select" id="monitorSelect" disabled>
                                        <option value="">请先选择监控类型</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row mt-3">
                                <div class="col-md-12 text-end">
                                    <button type="button" class="btn btn-success" id="assignMonitor" disabled>分配监控</button>
                                    <button type="button" class="btn btn-danger" id="clearMonitor" disabled>清除监控</button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="map-container">
                            <div id="chinaMap" style="width: 100%; height: 500px;"></div>
                        </div>
                        
                        <input type="hidden" id="provinceConfig">
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveMapConfig">确定</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 错误提示模态框 -->
    <div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="errorModalLabel">错误提示</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="errorMessage"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script>
        // 获取会话cookie
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        // 显示错误消息
        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            const modal = new bootstrap.Modal(document.getElementById('errorModal'));
            modal.show();
        }

        // 获取URL参数
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(window.location.href);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        // 组件ID计数器
        let componentIdCounter = 0;
        
        // 当前编辑的组件ID
        let currentEditComponentId = null;
        
        // 存储监控项数据
        let tcpMonitors = [];
        let udpMonitors = [];
        let httpMonitors = [];

        // 根据ID获取监控项
        function getMonitorById(type, id) {
            switch(type) {
                case 'tcp':
                    return tcpMonitors.find(m => m.id == id);
                case 'udp':
                    return udpMonitors.find(m => m.id == id);
                case 'http':
                    return httpMonitors.find(m => m.id == id);
                default:
                    return null;
            }
        }

        // 生成新的组件ID
        function generateComponentId() {
            return 'component_' + (++componentIdCounter);
        }

        // 加载所有监控项
        async function loadAllMonitors() {
            try {
                // 加载TCP监控项
                const tcpResponse = await fetch('/api/tcp-monitors', {
                    headers: {
                        'Authorization': getCookie('session')
                    }
                });
                
                const tcpData = await tcpResponse.json();
                if (tcpData.success) {
                    tcpMonitors = tcpData.monitors;
                    populateTcpMonitorSelect();
                }
                
                // 加载UDP监控项
                const udpResponse = await fetch('/api/udp-monitors', {
                    headers: {
                        'Authorization': getCookie('session')
                    }
                });
                
                const udpData = await udpResponse.json();
                if (udpData.success) {
                    udpMonitors = udpData.monitors;
                    populateUdpMonitorSelect();
                }
                
                // 加载HTTP(S)监控项
                const httpResponse = await fetch('/api/http-monitors', {
                    headers: {
                        'Authorization': getCookie('session')
                    }
                });
                
                const httpData = await httpResponse.json();
                if (httpData.success) {
                    httpMonitors = httpData.monitors;
                    populateHttpMonitorSelect();
                }
            } catch (error) {
                console.error('Error loading monitors:', error);
                showError('加载监控项时发生错误');
            }
        }

        // 填充TCP监控项选择框
        function populateTcpMonitorSelect() {
            const select = document.getElementById('tcpMonitorSelect');
            select.innerHTML = '<option value="">请选择TCP监控项</option>';
            
            tcpMonitors.forEach(monitor => {
                if (monitor.enabled) {
                    const option = document.createElement('option');
                    option.value = monitor.id;
                    option.textContent = `${monitor.ip}:${monitor.port} (ID: ${monitor.id})`;
                    select.appendChild(option);
                }
            });
        }

        // 填充UDP监控项选择框
        function populateUdpMonitorSelect() {
            const select = document.getElementById('udpMonitorSelect');
            select.innerHTML = '<option value="">请选择UDP监控项</option>';
            
            udpMonitors.forEach(monitor => {
                if (monitor.enabled) {
                    const option = document.createElement('option');
                    option.value = monitor.id;
                    option.textContent = `${monitor.ip}:${monitor.port} (ID: ${monitor.id})`;
                    select.appendChild(option);
                }
            });
        }

        // 填充HTTP(S)监控项选择框
        function populateHttpMonitorSelect() {
            const select = document.getElementById('httpMonitorSelect');
            select.innerHTML = '<option value="">请选择HTTP(S)监控项</option>';
            
            httpMonitors.forEach(monitor => {
                if (monitor.enabled) {
                    const option = document.createElement('option');
                    option.value = monitor.id;
                    option.textContent = `${monitor.method} ${monitor.url} (ID: ${monitor.id})`;
                    select.appendChild(option);
                }
            });
        }

        // 添加TCP组件
        function addTcpComponent(id = null, data = {}) {
            const componentId = id || generateComponentId();
            const monitorId = data.monitorId || '';
            const title = data.title || 'TCP监控组件';
            
            // 查找监控项信息用于显示
            const monitor = tcpMonitors.find(m => m.id == monitorId);
            const displayText = monitor ? `${monitor.ip}:${monitor.port}` : '未知监控项';
            const interval = monitor ? monitor.interval_seconds : 60;
            
            const componentElement = document.createElement('div');
            componentElement.className = 'draggable-item';
            componentElement.setAttribute('data-component-id', componentId);
            componentElement.setAttribute('data-component-type', 'tcp');
            componentElement.setAttribute('draggable', 'true');
            componentElement.innerHTML = `
                <div class="drag-handle d-flex justify-content-between align-items-center">
                    <span>${title}</span>
                    <div>
                        <button class="btn btn-sm btn-outline-light edit-component" data-component-id="${componentId}" type="button">编辑</button>
                        <button class="btn btn-sm btn-outline-light remove-component" data-component-id="${componentId}" type="button">删除</button>
                    </div>
                </div>
                <div class="component-form">
                    <div class="row">
                        <div class="col-md-8">
                            <strong>监控项:</strong> ${displayText}
                        </div>
                        <div class="col-md-4">
                            <strong>间隔:</strong> ${interval}秒
                        </div>
                    </div>
                </div>
                <div class="component-controls">
                    <input type="hidden" class="component-data" value='${JSON.stringify({type: 'tcp', monitorId, interval, title})}'>
                </div>
            `;
            
            document.getElementById('noComponentsMessage').style.display = 'none';
            document.getElementById('componentsContainer').appendChild(componentElement);
            
            // 绑定编辑和删除事件
            componentElement.querySelector('.edit-component').addEventListener('click', (e) => {
                e.preventDefault();
                editTcpComponent(componentId);
            });
            componentElement.querySelector('.remove-component').addEventListener('click', () => removeComponent(componentId));
            
            // 绑定拖动事件
            bindDragEvents(componentElement);
            
            return componentId;
        }

        // 添加UDP组件
        function addUdpComponent(id = null, data = {}) {
            const componentId = id || generateComponentId();
            const monitorId = data.monitorId || '';
            const title = data.title || 'UDP监控组件';
            
            // 查找监控项信息用于显示
            const monitor = udpMonitors.find(m => m.id == monitorId);
            const displayText = monitor ? `${monitor.ip}:${monitor.port}` : '未知监控项';
            const interval = monitor ? monitor.interval_seconds : 60;
            
            const componentElement = document.createElement('div');
            componentElement.className = 'draggable-item';
            componentElement.setAttribute('data-component-id', componentId);
            componentElement.setAttribute('data-component-type', 'udp');
            componentElement.setAttribute('draggable', 'true');
            componentElement.innerHTML = `
                <div class="drag-handle d-flex justify-content-between align-items-center">
                    <span>${title}</span>
                    <div>
                        <button class="btn btn-sm btn-outline-light edit-component" data-component-id="${componentId}" type="button">编辑</button>
                        <button class="btn btn-sm btn-outline-light remove-component" data-component-id="${componentId}" type="button">删除</button>
                    </div>
                </div>
                <div class="component-form">
                    <div class="row">
                        <div class="col-md-8">
                            <strong>监控项:</strong> ${displayText}
                        </div>
                        <div class="col-md-4">
                            <strong>间隔:</strong> ${interval}秒
                        </div>
                    </div>
                </div>
                <div class="component-controls">
                    <input type="hidden" class="component-data" value='${JSON.stringify({type: 'udp', monitorId, interval, title})}'>
                </div>
            `;
            
            document.getElementById('noComponentsMessage').style.display = 'none';
            document.getElementById('componentsContainer').appendChild(componentElement);
            
            // 绑定编辑和删除事件
            componentElement.querySelector('.edit-component').addEventListener('click', (e) => {
                e.preventDefault();
                editUdpComponent(componentId);
            });
            componentElement.querySelector('.remove-component').addEventListener('click', () => removeComponent(componentId));
            
            // 绑定拖动事件
            bindDragEvents(componentElement);
            
            return componentId;
        }

        // 添加HTTP组件
        function addHttpComponent(id = null, data = {}) {
            const componentId = id || generateComponentId();
            const monitorId = data.monitorId || '';
            const title = data.title || 'HTTP(S)监控组件';
            
            // 查找监控项信息用于显示
            const monitor = httpMonitors.find(m => m.id == monitorId);
            const displayText = monitor ? `${monitor.method} ${monitor.url}` : '未知监控项';
            const interval = monitor ? monitor.interval_seconds : 60;
            
            const componentElement = document.createElement('div');
            componentElement.className = 'draggable-item';
            componentElement.setAttribute('data-component-id', componentId);
            componentElement.setAttribute('data-component-type', 'http');
            componentElement.setAttribute('draggable', 'true');
            componentElement.innerHTML = `
                <div class="drag-handle d-flex justify-content-between align-items-center">
                    <span>${title}</span>

        // 绑定拖动事件
        function bindDragEvents(element) {
            element.addEventListener('dragstart', handleDragStart);
            element.addEventListener('dragover', handleDragOver);
            element.addEventListener('dragenter', handleDragEnter);
            element.addEventListener('dragleave', handleDragLeave);
            element.addEventListener('drop', handleDrop);
            element.addEventListener('dragend', handleDragEnd);
        }

        // 当前拖动的元素
        let draggedItem = null;

        // 处理拖动开始
        function handleDragStart(e) {
            draggedItem = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', this.innerHTML);
        }

        // 处理拖动经过
        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        // 处理拖动进入元素
        function handleDragEnter(e) {
            e.preventDefault();
            this.classList.add('drag-over');
        }

        // 处理拖动离开元素
        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }

        // 处理放置
        function handleDrop(e) {
            e.stopPropagation();
            
            if (draggedItem !== this) {
                const container = document.getElementById('componentsContainer');
                const allItems = [...container.querySelectorAll('.draggable-item')];
                const thisIndex = allItems.indexOf(this);
                const draggedIndex = allItems.indexOf(draggedItem);
                
                if (draggedIndex < thisIndex) {
                    container.insertBefore(draggedItem, this.nextSibling);
                } else {
                    container.insertBefore(draggedItem, this);
                }
            }
            
            this.classList.remove('drag-over');
            return false;
        }

        // 处理拖动结束
        function handleDragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('.draggable-item').forEach(item => {
                item.classList.remove('drag-over');
            });
            draggedItem = null;
        }

        // 初始化地图
        function initMap() {
            const mapContainer = document.getElementById('chinaMap');
            mapContainer.innerHTML = '';
            
            // 初始化ECharts实例
            const myChart = echarts.init(mapContainer);
            
            // 获取所有省份名称（这里使用ECharts内置的中国地图数据）
            const chinaGeoJson = window.echarts?.getMap?.('china')?.geoJson;
            const provinces = [];
            if (chinaGeoJson && chinaGeoJson.features) {
                chinaGeoJson.features.forEach(feature => {
                    provinces.push({
                        name: feature.properties.name,
                        id: feature.id
                    });
                });
            }

            // 如果没有获取到内置地图数据，则使用默认列表
            const defaultProvinces = [
                "北京","天津","上海","重庆","河北","山西","辽宁","吉林","黑龙江",
                "江苏","浙江","安徽","福建","江西","山东","河南","湖北","湖南",
                "广东","海南","四川","贵州","云南","陕西","甘肃","青海","台湾",
                "内蒙古","广西","西藏","宁夏","新疆"
            ];
            
            const allProvinces = provinces.length > 0 ? provinces : defaultProvinces.map(name => ({name, id: name}));

            // 地图配置选项
            const option = {
                title: {
                    text: '中国地图',
                    left: 'center'
                },
                tooltip: {
                    trigger: 'item',
                    showDelay: 0,
                    transitionDuration: 0.2,
                    formatter: function (params) {
                        const provinceName = params.name;
                        const config = provinceConfig[params.name]; // 使用省份名称作为键
                        
                        let tip = provinceName;
                        if (config) {
                            let monitorType = '';
                            switch(config.type) {
                                case 'tcp': 
                                    monitorType = 'TCP监控';
                                    break;
                                case 'udp': 
                                    monitorType = 'UDP监控';
                                    break;
                                case 'http': 
                                    monitorType = 'HTTP(S)监控';
                                    break;
                            }
                            
                            const monitor = getMonitorById(config.type, config.id);
                            if (monitor) {
                                if (config.type === 'http') {
                                    tip += `<br/>${monitorType}: ${monitor.method} ${monitor.url}`;
                                } else {
                                    tip += `<br/>${monitorType}: ${monitor.ip}:${monitor.port}`;
                                }
                            } else {
                                tip += `<br/>${monitorType}: ID ${config.id}`;
                            }
                        } else {
                            tip += '<br/>未配置监控';
                        }
                        
                        return tip;
                    }
                },
                visualMap: {
                    show: true,
                    type: 'piecewise',
                    pieces: [
                        { value: -1, label: '未配置', color: '#ccc' },
                        { value: 0, label: '已配置', color: '#0d6efd' }
                    ],
                    textStyle: {
                        color: '#000'
                    },
                    left: 'right'
                },
                series: [
                    {
                        name: '中国地图',
                        type: 'map',
                        map: 'china',
                        roam: false,
                        emphasis: {
                            label: {
                                show: true
                            }
                        },
                        data: allProvinces.map(province => ({
                            name: province.name,
                            value: provinceConfig[province.name] ? 0 : -1
                        })),
                        nameProperty: 'name',
                        selectedMode: 'single',
                        select: {
                            itemStyle: {
                                color: '#0d6efd'
                            }
                        }
                    }
                ]
            };

            // 使用配置项显示图表
            myChart.setOption(option);
            
            // 确保图表填充整个容器
            setTimeout(() => {
                myChart.resize();
            }, 100);
            
            // 绑定省份点击事件
            myChart.on('click', function (params) {
                if (params.componentType === 'series') {
                    const provinceName = params.name;
                    
                    // 更新选中状态
                    selectProvince(provinceName, provinceName);
                }
            });
            
            // 将图表实例存储在容器元素上，以便后续更新
            mapContainer.chart = myChart;
            
            // 绑定监控类型选择事件
            document.getElementById('monitorType').addEventListener('change', function() {
                updateMonitorSelect();
                document.getElementById('monitorSelect').disabled = this.value === '';
            });
            
            // 绑定分配监控按钮事件
            document.getElementById('assignMonitor').addEventListener('click', assignMonitor);
            
            // 绑定清除监控按钮事件
            document.getElementById('clearMonitor').addEventListener('click', clearMonitor);


            mapContainer.chart.resize();
        }

        // 选择省份
        function selectProvince(provinceId, provinceName) {
            // 更新选中省份显示
            document.getElementById('selectedProvince').textContent = provinceName;
            selectedProvince = provinceId;
            
            // 更新地图显示
            updateMapDisplay();
            
            // 启用操作按钮
            document.getElementById('assignMonitor').disabled = false;
            document.getElementById('clearMonitor').disabled = false;
            
            // 显示当前省份的配置
            showProvinceConfig(provinceId);
        }

        // 显示省份配置
        function showProvinceConfig(provinceId) {
            const config = provinceConfig[provinceId];
            if (config) {
                document.getElementById('monitorType').value = config.type;
                updateMonitorSelect();
                document.getElementById('monitorSelect').value = `${config.type}-${config.id}`;
            } else {
                document.getElementById('monitorType').value = '';
                updateMonitorSelect();
                document.getElementById('monitorSelect').value = '';
            }
        }

        // 更新监控项选择框
        function updateMonitorSelect() {
            const monitorType = document.getElementById('monitorType').value;
            const select = document.getElementById('monitorSelect');
            
            // 清空选择框
            select.innerHTML = '<option value="">请选择监控项</option>';
            select.disabled = !monitorType;
            
            if (!monitorType) {
                return;
            }
            
            // 根据类型填充选择框
            let monitors = [];
            switch (monitorType) {
                case 'tcp':
                    monitors = tcpMonitors;
                    break;
                case 'udp':
                    monitors = udpMonitors;
                    break;
                case 'http':
                    monitors = httpMonitors;
                    break;
            }
            
            monitors.forEach(monitor => {
                if (monitor.enabled) {
                    const option = document.createElement('option');
                    option.value = `${monitorType}-${monitor.id}`;
                    
                    if (monitorType === 'http') {
                        option.textContent = `${monitor.method} ${monitor.url} (ID: ${monitor.id})`;
                    } else {
                        option.textContent = `${monitor.ip}:${monitor.port} (ID: ${monitor.id})`;
                    }
                    
                    select.appendChild(option);
                }
            });
        }

        // 分配监控
        function assignMonitor() {
            if (!selectedProvince) {
                showError('请先选择一个省份');
                return;
            }
            
            const monitorType = document.getElementById('monitorType').value;
            const monitorValue = document.getElementById('monitorSelect').value;
            
            if (!monitorType || !monitorValue) {
                showError('请选择监控类型和监控项');
                return;
            }
            
            // 解析监控项信息
            const [type, id] = monitorValue.split('-');
            
            // 保存配置
            provinceConfig[selectedProvince] = { type, id };
            
            // 更新地图显示
            updateMapDisplay();
            
            alert(`已为 ${document.getElementById('selectedProvince').textContent} 分配监控`);
        }

        // 清除监控
        function clearMonitor() {
            if (!selectedProvince) {
                showError('请先选择一个省份');
                return;
            }
            
            // 清除配置
            delete provinceConfig[selectedProvince];
            
            // 更新地图显示
            updateMapDisplay();
            
            // 重置选择框
            document.getElementById('monitorType').value = '';
            updateMonitorSelect();
            document.getElementById('monitorSelect').value = '';
            
            alert(`已清除 ${document.getElementById('selectedProvince').textContent} 的监控配置`);
        }

        // 更新地图显示
        function updateMapDisplay() {
            const mapContainer = document.getElementById('chinaMap');
            if (!mapContainer.chart) return;
            
            const chart = mapContainer.chart;
            
            // 更新图表数据
            const option = {
                series: [{
                    data: Object.keys(provinceConfig).map(provinceId => ({
                        name: provinceId,
                        provinceId: provinceId,
                        value: 0 // 已配置
                    }))
                }]
            };
            
            chart.setOption(option);
        }

        // 加载页面配置
        async function loadPageConfig() {
            const pageId = getUrlParameter('id');
            if (!pageId) {
                showError('无效的页面ID');
                return;
            }

            try {
                // 先加载所有监控项
                await loadAllMonitors();
                
                const response = await fetch(`/api/page/${pageId}`, {
                    headers: {
                        'Authorization': getCookie('session')
                    }
                });

                const data = await response.json();

                if (!data.success) {
                    showError(data.message || '获取页面配置失败');
                    return;
                }

                const page = data.page;

                // 填充表单
                document.getElementById('pageId').value = page.id;
                document.getElementById('pageEnabled').checked = page.enabled;
                document.getElementById('pageRoute').value = page.route || '';
                
                // 解析并加载组件配置
                if (page.config) {
                    try {
                        const config = JSON.parse(page.config);
                        if (Array.isArray(config)) {
                            config.forEach(component => {
                                switch (component.type) {
                                    case 'tcp':
                                        addTcpComponent(null, component);
                                        break;
                                    case 'udp':
                                        addUdpComponent(null, component);
                                        break;
                                    case 'http':
                                        addHttpComponent(null, component);
                                        break;
                                    case 'map':
                                        addMapComponent(null, component);
                                        break;
                                    case 'title':
                                        document.getElementById('pageTitle').value = component.title || '';
                                }
                            });
                        }
                    } catch (e) {
                        console.error('Error parsing page config:', e);
                    }
                }
            } catch (error) {
                console.error('Error loading page config:', error);
                showError('加载页面配置时发生错误');
            }
        }

        // 保存页面配置
        async function savePageConfig() {
            const pageId = document.getElementById('pageId').value;
            const title = document.getElementById('pageTitle').value.trim();
            const enabled = document.getElementById('pageEnabled').checked;
            const route = document.getElementById('pageRoute').value.trim();
            
            if (!pageId) {
                showError('无效的页面ID');
                return;
            }
            
            if (!title) {
                showError('请输入页面标题');
                return;
            }
            
            if (!route) {
                showError('请填写路由');
                return;
            }

            // 收集所有组件配置
            const components = [];
            const componentElements = document.querySelectorAll('.draggable-item');
            
            componentElements.forEach(element => {
                try {
                    const componentData = JSON.parse(element.querySelector('.component-data').value);
                    components.push(componentData);
                } catch (e) {
                    console.error('Error parsing component data:', e);
                }
            });

            // 添加页面标题

            components.push({
                type: 'title',
                title: title
            });
            
            // 将组件配置转换为JSON字符串
            const configJson = JSON.stringify(components);

            try {
                const response = await fetch(`/api/page/${pageId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': getCookie('session')
                    },
                    body: JSON.stringify({ 
                        title: title,
                        enabled: enabled,
                        route: route,
                        config: configJson
                    })
                });

                const data = await response.json();

                if (!data.success) {
                    showError(data.message || '保存页面配置失败');
                    return;
                }

                alert('页面配置保存成功');
            } catch (error) {
                console.error('Error saving page config:', error);
                showError('保存页面配置时发生错误');
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 加载页面配置
            loadPageConfig();

            // 绑定按钮事件
            document.getElementById('backButton').addEventListener('click', function() {
                window.location.href = '/dash.html';
            });

            document.getElementById('addComponent').addEventListener('click', function() {
                const modal = new bootstrap.Modal(document.getElementById('addComponentModal'));
                modal.show();
            });

            document.getElementById('saveConfig').addEventListener('click', savePageConfig);

            // 绑定添加组件按钮事件
            document.querySelectorAll('[data-component-type]').forEach(button => {
                button.addEventListener('click', function() {
                    const componentType = this.getAttribute('data-component-type');
                    
                    // 关闭添加组件模态框
                    const addModal = bootstrap.Modal.getInstance(document.getElementById('addComponentModal'));
                    addModal.hide();
                    
                    // 根据组件类型打开相应的模态框
                    switch (componentType) {
                        case 'tcp':
                            // 重置表单
                            document.getElementById('tcpComponentForm').reset();
                            document.getElementById('tcpComponentId').value = '';
                            
                            const tcpModal = new bootstrap.Modal(document.getElementById('tcpComponentModal'));
                            tcpModal.show();
                            break;
                        case 'udp':
                            // 重置表单
                            document.getElementById('udpComponentForm').reset();
                            document.getElementById('udpComponentId').value = '';
                            
                            const udpModal = new bootstrap.Modal(document.getElementById('udpComponentModal'));
                            udpModal.show();
                            break;
                        case 'http':
                            // 重置表单
                            document.getElementById('httpComponentForm').reset();
                            document.getElementById('httpComponentId').value = '';
                            
                            const httpModal = new bootstrap.Modal(document.getElementById('httpComponentModal'));
                            httpModal.show();
                            break;
                        case 'map':
                            // 重置表单
                            document.getElementById('mapComponentForm').reset();
                            document.getElementById('mapComponentId').value = '';
                            
                            const mapModal = new bootstrap.Modal(document.getElementById('mapComponentModal'));
                            mapModal.show();
                            break;
                    }
                });
            });

            // 绑定保存组件按钮事件
            document.getElementById('saveTcpComponent').addEventListener('click', saveTcpComponent);
            document.getElementById('saveUdpComponent').addEventListener('click', saveUdpComponent);
            document.getElementById('saveHttpComponent').addEventListener('click', saveHttpComponent);
            document.getElementById('saveMapComponent').addEventListener('click', saveMapComponent);
            document.getElementById('saveMapConfig').addEventListener('click', saveMapConfig);

            // 保存UDP配置
            document.getElementById('saveUdpConfig').addEventListener('click', async function () {
                const id = document.getElementById('udpId').value;
                const title = document.getElementById('udpTitle').value; // 获取标题
                const ip = document.getElementById('udpIp').value;
                const port = document.getElementById('udpPort').value;
                const interval = document.getElementById('udpInterval').value;
                const enabled = document.getElementById('udpEnabled').checked ? 1 : 0;

                const data = { id, title, ip, port, interval_seconds: interval, enabled };

                try {
                    const response = await fetch('/api/udp-monitor', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': getCookie('session')
                        },
                        body: JSON.stringify(data),
                    });

                    const result = await response.json();
                    if (result.success) {
                        alert('UDP监控配置保存成功');
                        bootstrap.Modal.getInstance(document.getElementById('udpConfigModal')).hide();
                        loadAllMonitors(); // 重新加载所有监控项以更新列表
                    } else {
                        alert('保存失败: ' + result.message);
                    }
                } catch (error) {
                    console.error('Error saving UDP config:', error);
                    alert('保存UDP配置时出错');
                }
            });

            // 保存HTTP配置
            document.getElementById('saveHttpConfig').addEventListener('click', async function () {
                const id = document.getElementById('httpId').value;
                const title = document.getElementById('httpTitle').value; // 获取标题
                const url = document.getElementById('httpUrl').value;
                const method = document.getElementById('httpMethod').value;
                const interval = document.getElementById('httpInterval').value;
                const enabled = document.getElementById('httpEnabled').checked ? 1 : 0;

                const data = { id, title, url, method, interval_seconds: interval, enabled };

                try {
                    const response = await fetch('/api/http-monitor', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(data),
                    });

                    const result = await response.json();
                    if (result.success) {
                        alert('HTTP(S)监控配置保存成功');
                        bootstrap.Modal.getInstance(document.getElementById('httpConfigModal')).hide();
                        loadHttpMonitors(); // 重新加载HTTP(S)监控列表
                    } else {
                        alert('保存失败: ' + result.message);
                    }
                } catch (error) {
                    console.error('Error saving HTTP config:', error);
                    alert('保存HTTP配置时出错');
                }
            });
        });
        
        // 监听窗口大小变化，确保地图正确调整大小
        window.addEventListener('resize', function() {
            const mapContainer = document.getElementById('chinaMap');
            if (mapContainer && mapContainer.chart) {
                // 使用防抖动确保性能
                clearTimeout(mapContainer.resizeTimer);
                mapContainer.resizeTimer = setTimeout(() => {
                    mapContainer.chart.resize();
                }, 100);
            }
        });

        // 添加组件到页面
        function addComponentToPage(type, monitor) {
            const componentList = document.getElementById('componentList');
            const componentItem = document.createElement('div');
            componentItem.className = 'component-item';
            componentItem.dataset.id = Date.now(); // 临时ID
            componentItem.dataset.type = type;
            componentItem.dataset.monitorId = monitor.id;
            componentItem.dataset.title = monitor.title || ''; // 保存标题

            let displayName = '';
            switch (type) {
                case 'tcp':
                    displayName = `TCP: ${monitor.title || monitor.ip + ':' + monitor.port}`;
                    break;
                case 'udp':
                    displayName = `UDP: ${monitor.title || monitor.ip + ':' + monitor.port}`;
                    break;
                case 'http':
                    displayName = `HTTP: ${monitor.title || monitor.method + ' ' + monitor.url}`;
                    break;
                case 'map':
                    displayName = `地图: ${monitor.title || monitor.name}`;
                    break;
            }

            componentItem.innerHTML = `
                <span>${displayName}</span>
                <div>
                    <button class="btn btn-sm btn-outline-primary move-up">上移</button>
                    <button class="btn btn-sm btn-outline-primary move-down">下移</button>
                    <button class="btn btn-sm btn-outline-danger remove">移除</button>
                </div>
            `;

            componentList.appendChild(componentItem);

            // 绑定事件
            componentItem.querySelector('.move-up').addEventListener('click', () => moveComponent(componentItem, -1));
            componentItem.querySelector('.move-down').addEventListener('click', () => moveComponent(componentItem, 1));
            componentItem.querySelector('.remove').addEventListener('click', () => componentItem.remove());
        }
    </script>
</body>
</html>
