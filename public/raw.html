<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>监控面板</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <script src="/js/echarts.min.js"></script>
    <script src="/js/china.js"></script>
    <style>
        .component-container {
            margin-bottom: 15px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f8f9fa;
        }
        .chart-container {
            width: 100%;
            height: 500px; /* 增加地图容器高度 */
        }
        .tcp .chart-container,
        .udp .chart-container,
        .http .chart-container {
            height: 80px; /* TCP、UDP、HTTP监控项使用更小的高度 */
        }
        .loading {
            text-align: center;
            padding: 20px;
        }
        .error {
            color: #dc3545;
        }
        .status-icon {
            font-size: 1.2rem;
            margin-left: 10px;
        }
        .status-success {
            color: #28a745;
        }
        .status-warning {
            color: #ffc107;
        }
        .status-danger {
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4"><span id="page-main-title">加载中...</span></h1>
        <div id="components-container">
            <div class="loading">加载中...</div>
        </div>
    </div>
    
    <script src="/js/bootstrap.bundle.min.js"></script>
    <script>
        // 全局变量
        let pageId = null;
        let pageRoute = null;
        
        // 初始化页面
        async function initPage() {
            // 从URL路径中提取路由参数
            const pathParts = window.location.pathname.split('/');
            pageRoute = pathParts[pathParts.length - 1];
            
            if (!pageRoute) {
                document.getElementById('components-container').innerHTML = 
                    '<div class="alert alert-danger">缺少路由参数</div>';
                return;
            }
            
            try {
                // 查找匹配的页面
                const response = await fetch('/board/api/frontend/pages', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (!data.success) {
                    document.getElementById('components-container').innerHTML = 
                        '<div class="alert alert-danger">加载页面列表失败</div>';
                    return;
                }
                
                // 查找匹配的页面（注意：API返回的route是简单名称，不是完整路径）
                const page = data.pages.find(p => p.route === pageRoute && p.enabled);
                
                if (!page) {
                    document.getElementById('components-container').innerHTML = 
                        '<div class="alert alert-danger">页面未找到或未启用</div>';
                    return;
                }
                
                // 设置页面标题
                document.getElementById('page-main-title').textContent = pageRoute;
                pageId = page.id;
                
                // 加载页面组件
                await loadComponents(page);
            } catch (error) {
                console.error('Error initializing page:', error);
                document.getElementById('components-container').innerHTML = 
                    '<div class="alert alert-danger">初始化页面时发生错误</div>';
            }
        }
        
        // 获取组件数据并渲染
        async function loadComponents(page) {
            try {
                // 解析页面配置
                let components = [];
                try {
                    // 添加调试信息
                    console.log('Page config:', page.config);
                    
                    if (!page.config) {
                        document.getElementById('components-container').innerHTML = 
                            '<div class="alert alert-warning">页面配置为空</div>';
                        return;
                    }
                    
                    components = JSON.parse(page.config);
                } catch (e) {
                    console.error('Error parsing page config:', e);
                    document.getElementById('components-container').innerHTML = 
                        `<div class="alert alert-danger">页面配置解析错误: ${e.message}</div>
                         <div class="alert alert-info">配置内容: ${page.config}</div>`;
                    return;
                }
                
                // 渲染组件
                const container = document.getElementById('components-container');
                container.innerHTML = '';
                
                if (components.length === 0) {
                    container.innerHTML = '<div class="alert alert-info">该页面暂无组件</div>';
                    return;
                }
                
                for (const component of components) {
                    const componentElement = document.createElement('div');
                    componentElement.className = 'component-container ' + component.type; // 添加组件类型作为类名
                    componentElement.setAttribute('data-component-type', component.type);
                    
                    switch (component.type) {
                        case 'title':
                            // 设置页面主标题
                            document.getElementById('page-main-title').textContent = component.title || '监控面板';
                            break;
                        case 'tcp':
                            componentElement.innerHTML = `
                                <div class="d-flex justify-content-between align-items-center">
                                    <span>${component.title || 'TCP监控'}</span>
                                    <span class="status-icon" id="tcp-status-${component.monitorId}">⏳</span>
                                </div>
                            `;
                            container.appendChild(componentElement);
                            await loadTcpMonitor(component.monitorId, componentElement, component);
                            break;
                        case 'udp':
                            componentElement.innerHTML = `
                                <div class="d-flex justify-content-between align-items-center">
                                    <span>${component.title || 'UDP监控'}</span>
                                    <span class="status-icon" id="udp-status-${component.monitorId}">⏳</span>
                                </div>
                            `;
                            container.appendChild(componentElement);
                            await loadUdpMonitor(component.monitorId, componentElement, component);
                            break;
                        case 'http':
                            componentElement.innerHTML = `
                                <div class="d-flex justify-content-between align-items-center">
                                    <span>${component.title || 'HTTP监控'}</span>
                                    <span class="status-icon" id="http-status-${component.monitorId}">⏳</span>
                                </div>
                            `;
                            container.appendChild(componentElement);
                            await loadHttpMonitor(component.monitorId, componentElement, component);
                            break;
                        case 'map':
                            componentElement.innerHTML = `
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span>${component.name || '地图组件'}</span>
                                </div>
                                <div id="map-chart-${component.name || 'map'}" class="chart-container"></div>
                            `;
                            container.appendChild(componentElement);
                            // 初始化地图组件
                            initMapComponent(component, componentElement);
                            break;
                        default:
                            componentElement.innerHTML = `
                                <div class="d-flex justify-content-between align-items-center">
                                    <span>${component.title || '未知组件'}</span>
                                </div>
                            `;
                            container.appendChild(componentElement);
                    }
                }
            } catch (error) {
                console.error('Error loading components:', error);
                document.getElementById('components-container').innerHTML = 
                    `<div class="alert alert-danger">加载组件时发生错误: ${error.message}</div>`;
            }
        }
        
        // 计算状态图标
        function calculateStatusIcon(results) {
            if (!results || results.length === 0) {
                return '❓'; // 未知状态
            }
            
            const successCount = results.filter(r => r.success).length;
            
            if (successCount === results.length) {
                return '✅'; // 全部成功 - 绿色勾
            } else if (successCount === 0) {
                return '❌'; // 全部失败 - 红色叉
            } else {
                return '⚠️'; // 部分失败 - 黄色三角
            }
        }
        
        // 加载TCP监控项数据
        async function loadTcpMonitor(monitorId, element, componentConfig) {
            try {
                // 获取最近的监控结果
                const resultsResponse = await fetch(`/board/api/frontend/tcp-monitor/${monitorId}/results?count=5`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const resultsData = await resultsResponse.json();
                const statusIcon = calculateStatusIcon(resultsData.results);
                document.getElementById(`tcp-status-${monitorId}`).textContent = statusIcon;
                document.getElementById(`tcp-status-${monitorId}`).className = 'status-icon ' + 
                    (statusIcon === '✅' ? 'status-success' : 
                     statusIcon === '⚠️' ? 'status-warning' : 'status-danger');
                
                // 初始化图表（如果需要）
                // const chart = echarts.init(element.querySelector(`#tcp-chart-${monitorId}`));
                // 设置图表选项...
            } catch (error) {
                console.error('Error loading TCP monitor:', error);
            }
        }
        
        // 加载UDP监控项数据
        async function loadUdpMonitor(monitorId, element, componentConfig) {
            try {
                // 获取最近的监控结果
                const resultsResponse = await fetch(`/board/api/frontend/udp-monitor/${monitorId}/results?count=5`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const resultsData = await resultsResponse.json();
                const statusIcon = calculateStatusIcon(resultsData.results);
                document.getElementById(`udp-status-${monitorId}`).textContent = statusIcon;
                document.getElementById(`udp-status-${monitorId}`).className = 'status-icon ' + 
                    (statusIcon === '✅' ? 'status-success' : 
                     statusIcon === '⚠️' ? 'status-warning' : 'status-danger');
                
                // 初始化图表（如果需要）
                // const chart = echarts.init(element.querySelector(`#udp-chart-${monitorId}`));
                // 设置图表选项...
            } catch (error) {
                console.error('Error loading UDP monitor:', error);
            }
        }
        
        // 加载HTTP监控项数据
        async function loadHttpMonitor(monitorId, element, componentConfig) {
            try {
                // 获取最近的监控结果
                const resultsResponse = await fetch(`/board/api/frontend/http-monitor/${monitorId}/results?count=5`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const resultsData = await resultsResponse.json();
                const statusIcon = calculateStatusIcon(resultsData.results);
                document.getElementById(`http-status-${monitorId}`).textContent = statusIcon;
                document.getElementById(`http-status-${monitorId}`).className = 'status-icon ' + 
                    (statusIcon === '✅' ? 'status-success' : 
                     statusIcon === '⚠️' ? 'status-warning' : 'status-danger');
                
                // 初始化图表（如果需要）
                // const chart = echarts.init(element.querySelector(`#http-chart-${monitorId}`));
                // 设置图表选项...
            } catch (error) {
                console.error('Error loading HTTP monitor:', error);
            }
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initPage();
        });
        
        // 初始化地图组件
        function initMapComponent(component, element) {
            try {
                // 获取地图容器
                const chartContainer = element.querySelector(`#map-chart-${component.name || 'map'}`);
                if (!chartContainer) return;
                
                // 初始化ECharts实例
                const chart = echarts.init(chartContainer);
                
                // 从组件配置中获取省份与监控项的映射关系
                const provinceConfig = component.config ? JSON.parse(component.config) : {};
                
                // 获取所有监控项的状态数据
                fetchAllMonitorStatus(provinceConfig).then(provinceStatus => {
                    // 构建省份数据
                    const provinceData = [];
                    for (const province in provinceStatus) {
                        const status = provinceStatus[province];
                        let itemStyle = {};
                        
                        // 根据状态设置颜色
                        if (status === 'success') {
                            itemStyle = { areaColor: '#28a745' }; // 绿色 - 全部成功
                        } else if (status === 'warning') {
                            itemStyle = { areaColor: '#ffc107' }; // 黄色 - 部分失败
                        } else if (status === 'danger') {
                            itemStyle = { areaColor: '#dc3545' }; // 红色 - 全部失败
                        } else {
                            itemStyle = { areaColor: '#6c757d' }; // 灰色 - 未知状态
                        }
                        
                        provinceData.push({
                            name: province,
                            itemStyle: itemStyle,
                            status: status
                        });
                    }
                    
                    // 配置项
                    const option = {
                        tooltip: {
                            trigger: 'item',
                            formatter: function(params) {
                                let statusText = '';
                                switch (params.data.status) {
                                    case 'success':
                                        statusText = '正常';
                                        break;
                                    case 'warning':
                                        statusText = '警告';
                                        break;
                                    case 'danger':
                                        statusText = '异常';
                                        break;
                                    default:
                                        statusText = '未知';
                                }
                                return params.name + ': ' + statusText;
                            }
                        },
                        series: [
                            {
                                name: '监控状态',
                                type: 'map',
                                map: 'china',
                                roam: false,
                                zoom: 1.2,
                                selectedMode: false,
                                label: {
                                    show: false // 隐藏默认标签
                                },
                                emphasis: {
                                    label: {
                                        show: false // 隐藏高亮时的标签
                                    },
                                    itemStyle: {
                                        areaColor: '#FFD700' // 鼠标悬停时的高亮颜色
                                    }
                                },
                                data: provinceData
                            }
                        ],
                        visualMap: {
                            min: 0,
                            max: 100,
                            inRange: {
                                color: ['#6c757d', '#28a745', '#ffc107', '#dc3545']
                            },
                            show: false
                        }
                    };
                    
                    // 设置配置项
                    chart.setOption(option);
                    
                    // 监听窗口大小变化，自适应调整图表大小
                    window.addEventListener('resize', function() {
                        chart.resize();
                    });
                    
                    // 首次渲染后主动触发一次resize以确保正确适配容器尺寸
                    setTimeout(() => chart.resize(), 0);
                });
            } catch (error) {
                console.error('Error initializing map component:', error);
            }
        }
        
        // 获取所有监控项的状态数据
        async function fetchAllMonitorStatus(provinceConfig) {
            const provinceStatus = {};
            
            // 创建所有请求的Promise数组
            const promises = Object.entries(provinceConfig).map(async ([province, config]) => {
                try {
                    const { type, id } = config;
                    let results = [];
                    
                    // 根据监控项类型获取最近5次的结果
                    const response = await fetch(`/board/api/frontend/${type}-monitor/${id}/results?count=5`, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });
                    
                    const data = await response.json();
                    if (data.success) {
                        results = data.results;
                    }
                    
                    // 根据结果计算状态
                    if (results.length === 0) {
                        provinceStatus[province] = 'unknown'; // 未知状态
                    } else {
                        const successCount = results.filter(r => r.success).length;
                        
                        if (successCount === results.length) {
                            provinceStatus[province] = 'success'; // 全部成功 - 绿色
                        } else if (successCount === 0) {
                            provinceStatus[province] = 'danger'; // 全部失败 - 红色
                        } else {
                            provinceStatus[province] = 'warning'; // 部分失败 - 黄色
                        }
                    }
                } catch (error) {
                    console.error(`Error fetching status for ${province}:`, error);
                    provinceStatus[province] = 'unknown'; // 出错时设为未知状态
                }
            });
            
            // 等待所有请求完成
            await Promise.all(promises);
            
            return provinceStatus;
        }
    </script>
</body>
</html>
